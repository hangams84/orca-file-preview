name: release
# Builds every distributable for a version tag and publishes the GitHub release:
#   orca-file-preview-<v>.zip / .tar.gz   package (plugin + installer scripts)
#   file-preview-setup-<v>.run            macOS/Linux self-extracting installer
#   FilePreviewSetup-<v>.exe              Windows installer/updater (package embedded)
#   File-Preview-Setup-<v>-macos.zip      macOS app ("File Preview Setup.app")
# each with a .sha256. Release notes come from docs/release-notes/v<version>.md (tools/release-notes.mjs).
#
# Orca installs a plugin from a Git URL by taking the newest vX.Y.Z tag and expects orca-plugin.json at
# the repository root within its download size limit. So a release is started from the source with a
# `source-vX.Y.Z` tag on main; this workflow then commits the plugin files to the root of the `dist`
# branch, tags that commit `vX.Y.Z` and publishes the release there:
#   git tag -a source-v0.2.2 -m 0.2.2 && git push origin source-v0.2.2
on:
  push:
    tags: ['source-v*']
  workflow_dispatch:
    inputs:
      source:
        description: 'Existing source tag to (re)build, e.g. source-v0.2.2'
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      src: ${{ steps.v.outputs.src }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source || github.ref }}
      - id: v
        run: |
          SRC="${{ github.event.inputs.source || github.ref_name }}"
          VER=$(node -p "require('./plugin/orca-plugin.json').version")
          [ "source-v$VER" = "$SRC" ] || { echo "tag $SRC does not match plugin version $VER" >&2; exit 1; }
          echo "tag=v$VER" >>"$GITHUB_OUTPUT"
          echo "src=$SRC" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node tools/package-release.mjs
      - name: Self-extracting installer runs (status without Orca must fail cleanly)
        run: |
          set +e
          out=$(HOME=$(mktemp -d) sh dist/file-preview-setup-*.run status 2>&1); rc=$?
          echo "$out"; echo "exit $rc"
          echo "$out" | grep -q "Orca's command line tool was not found" || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: dist-package
          path: dist

  windows-exe:
    needs: package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.src }}
      - uses: actions/download-artifact@v4
        with:
          name: dist-package
          path: dist
      - name: Build FilePreviewSetup.exe
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-windows-exe.ps1
      - name: The exe unpacks and runs the installer (status without Orca must fail cleanly)
        shell: powershell
        run: |
          $exe = Get-ChildItem dist\FilePreviewSetup-*.exe | Select-Object -First 1
          $out = & $exe.FullName /status 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "Orca's command line tool was not found") { exit 1 }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/FilePreviewSetup-*.exe
            dist/FilePreviewSetup-*.exe.sha256

  macos-app:
    needs: package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.src }}
      - uses: actions/download-artifact@v4
        with:
          name: dist-package
          path: dist
      - run: bash tools/build-macos-app.sh
      - name: The app bundle is complete and signed (ad hoc)
        run: |
          cd "$(mktemp -d)" && ditto -x -k "$GITHUB_WORKSPACE"/dist/File-Preview-Setup-*-macos.zip .
          codesign --verify --deep --verbose=1 "File Preview Setup.app"
          test -f "File Preview Setup.app/Contents/Resources/File Preview/installer/unix/file-preview.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            dist/File-Preview-Setup-*-macos.zip
            dist/File-Preview-Setup-*-macos.zip.sha256

  publish:
    needs: [package, windows-exe, macos-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.src }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Commit the plugin to the dist branch and tag ${{ needs.package.outputs.tag }}
        env:
          TAG: ${{ needs.package.outputs.tag }}
          SRC: ${{ needs.package.outputs.src }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin dist; then git worktree add -q dist-wt FETCH_HEAD; else git worktree add -q --detach dist-wt && git -C dist-wt checkout -q --orphan dist; fi
          find dist-wt -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r plugin/. dist-wt/ && cp LICENSE dist-wt/ && rm -rf dist-wt/.orca
          cd dist-wt
          git add -A
          git commit -q -m "dist: File Preview ${TAG#v} (from $SRC, $(git -C .. rev-parse --short HEAD))" || echo "dist unchanged"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git ls-remote --exit-code --tags origin "$TAG" >/dev/null; then
            echo "$TAG already exists: keeping it"
          else
            git tag -a "$TAG" -m "File Preview for Orca ${TAG#v}"
            git push -q origin "HEAD:refs/heads/dist" "$TAG"
          fi
      - name: Publish ${{ needs.package.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          ls -la dist
          NOTES="docs/release-notes/$TAG.md"
          [ -f "$NOTES" ] || { echo "$NOTES missing" >&2; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "File Preview for Orca ${TAG#v}" --notes-file "$NOTES" --latest
          fi

  git-install:
    # What Orca's Settings -> Plugins -> Install -> Git URL does: the plain repository URL must resolve
    # to this release (newest vX.Y.Z tag on dist), stay within Orca's download limits and install.
    needs: [package, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.src }}
      - name: Orca image
        run: docker build --progress=plain -t orca-fp --build-arg UBUNTU=24.04 --build-arg MIRROR=http://archive.ubuntu.com/ubuntu tools/platform-test
      - name: Install from the Git URL in a fresh Orca
        env:
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --shm-size=1g --security-opt seccomp=unconfined -e EXPECT="${TAG#v}"             -v "$PWD:/src:ro" -v "$PWD/out:/out" --entrypoint bash orca-fp             /src/tools/platform-test/test-git-install.sh "https://github.com/${{ github.repository }}.git"
