name: orca-compat
# Installs each Orca release on Linux, macOS and Windows, installs the File Preview plugin into it and
# tests it there; the report job writes the version x OS table into README.md (between the
# ci-matrix markers). Orca 1.4.247 is below engines.orca (>=1.4.248) and must refuse the plugin.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'installer/**'
      - 'tools/platform-test/**'
      - 'tools/ci-report.mjs'
      - '.github/workflows/orca-compat.yml'

permissions:
  contents: read

concurrency:
  group: orca-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux · Orca ${{ matrix.orca }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        orca: ['1.4.247', '1.4.248', '1.4.249', '1.4.250', '1.4.251', '1.4.252', '1.4.253', '1.4.254', '1.4.255', '1.4.256', '1.4.257', '1.4.258']
    steps:
      - uses: actions/checkout@v4
      - name: Build Orca ${{ matrix.orca }} image (Ubuntu 24.04, Xvfb)
        run: |
          docker build -q -t orca-fp --build-arg UBUNTU=24.04 --build-arg ORCA_VERSION=${{ matrix.orca }} \
            --build-arg MIRROR=http://azure.archive.ubuntu.com/ubuntu tools/platform-test
      - name: Test the plugin in Orca ${{ matrix.orca }}
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --shm-size=1g --security-opt seccomp=unconfined \
            -e EXPECT_INCOMPATIBLE=${{ matrix.orca == '1.4.247' && '1' || '0' }} \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" orca-fp
      - name: Summary
        if: always()
        run: cat out/summary.md >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-linux-${{ matrix.orca }}
          path: out
          retention-days: 30

  macos:
    name: macos · Orca ${{ matrix.orca }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        orca: ['1.4.248', '1.4.253', '1.4.258']
    steps:
      - uses: actions/checkout@v4
      - name: Install Orca ${{ matrix.orca }}
        run: |
          set -eux
          curl -fsSL -o "$RUNNER_TEMP/orca.dmg" \
            "https://github.com/stablyai/orca/releases/download/v${{ matrix.orca }}/orca-macos-arm64.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/orca-dmg" "$RUNNER_TEMP/orca.dmg"
          APP=$(find "$RUNNER_TEMP/orca-dmg" -maxdepth 1 -name '*.app' | head -1)
          sudo cp -R "$APP" /Applications/Orca.app
          hdiutil detach "$RUNNER_TEMP/orca-dmg"
          sudo xattr -dr com.apple.quarantine /Applications/Orca.app || true
          CLI=$(find /Applications/Orca.app/Contents -path '*/bin/orca' -type f | head -1)
          echo "ORCA=$CLI" >>"$GITHUB_ENV"
          "$CLI" --version
      - name: Test the plugin in Orca ${{ matrix.orca }}
        run: bash tools/platform-test/run-tests-macos.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/out/summary.md" >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-macos-${{ matrix.orca }}
          path: ${{ runner.temp }}/out
          retention-days: 30

  windows:
    # windows-2022: Windows Server 2022 (Windows 10 21H2 kernel family, build 20348)
    # windows-2025: Windows Server 2025 (Windows 11 24H2 kernel family, build 26100)
    name: ${{ matrix.os }} · Orca ${{ matrix.orca }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        orca: ['1.4.248', '1.4.253', '1.4.258']
    steps:
      - uses: actions/checkout@v4
      - name: Install Orca ${{ matrix.orca }} (per-user, silent)
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'orca-setup.exe'
          Invoke-WebRequest -Uri "https://github.com/stablyai/orca/releases/download/v${{ matrix.orca }}/orca-windows-setup.exe" -OutFile $setup
          Start-Process -Wait -FilePath $setup -ArgumentList '/S'
          $cli = Join-Path $env:LOCALAPPDATA 'Programs\orca\resources\bin\orca.exe'
          if (-not (Test-Path $cli)) { Get-ChildItem -Recurse -Depth 3 (Join-Path $env:LOCALAPPDATA 'Programs') -Filter orca.exe | Select-Object -First 5 FullName; throw 'Orca CLI not found' }
          & $cli --version
          # Orca's silent installer starts the app; close it so the test starts from a known state.
          Get-Process Orca -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Test the plugin in Orca ${{ matrix.orca }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\platform-test\run-tests-windows.ps1 -Src "$env:GITHUB_WORKSPACE" -Out "$env:RUNNER_TEMP\out"
      - name: Summary
        if: always()
        shell: pwsh
        run: Get-Content "$env:RUNNER_TEMP\out\summary.md" -ErrorAction SilentlyContinue | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.os }}-${{ matrix.orca }}
          path: ${{ runner.temp }}/out
          retention-days: 30

  windows7:
    # Orca (Electron 23+) cannot run on Windows 7/8; GitHub has no Windows 7 runners. This checks that
    # the Windows installer refuses there with a clear message (OS version overridden for the test).
    name: windows 7 guard
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Installer on "Windows 7" (6.1.7601) must refuse clearly
        shell: powershell
        run: |
          $env:FP_TEST_OS_VERSION = '6.1.7601'
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/file-preview.ps1 install -Yes 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          $ok = ($code -ne 0) -and ($out -match 'Windows 10 or later') -and ($out -match 'Windows 7')
          New-Item -ItemType Directory -Force out | Out-Null
          $res = [ordered]@{ platform = 'windows7-guard'; os = 'Windows 7 (simulated 6.1.7601)'; orcaVersion = 'n/a'
            checks = @([ordered]@{ name = 'installer refuses on Windows 7 with a clear message'; ok = $ok; detail = ($out.Trim() -split "`n")[0] }) }
          [IO.File]::WriteAllText("$PWD/out/results.json", ($res | ConvertTo-Json -Depth 4), (New-Object System.Text.UTF8Encoding($false)))
          if (-not $ok) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-windows7-guard
          path: out
          retention-days: 30

  report:
    name: report → README
    needs: [linux, macos, windows, windows7]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: artifacts
      - name: Build the version x OS table
        run: |
          node tools/ci-report.mjs artifacts --out ci-results.md --readme README.md \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          cat ci-results.md >>"$GITHUB_STEP_SUMMARY"
      - name: Commit README (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && { echo "README unchanged"; exit 0; }
          git commit -m "CI: Orca compatibility results [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: ci-results.md
